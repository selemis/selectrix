plugins {
    id 'java'
    id 'groovy'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenLocal()
    maven {
        url 'https://pkgs.dev.azure.com/interamerican/_packaging/interamerican/maven/v1'
        name 'interamerican'
        credentials {
            username = project.findProperty('systemProp.https.proxyUser') ?: System.getenv('AZURE_DEVOPS_USER')
            password = project.findProperty('systemProp.https.proxyPassword') ?: System.getenv('AZURE_DEVOPS_PASSWORD')
        }
        authentication {
            basic(BasicAuthentication)
        }
    }
    mavenCentral()
}

dependencies {
    testImplementation platform('org.spockframework:spock-bom:2.3-groovy-3.0')
    testImplementation 'org.spockframework:spock-core'
    testImplementation 'org.codehaus.groovy:groovy-all:3.0.21'
}

test {
    useJUnitPlatform()
}

// Task to build the unzip plugin as a standalone JAR
task unzipPluginJar(type: Jar) {
    archiveBaseName = 'unzip-plugin'
    archiveVersion = '1.0'

    // Include only the UnzipFileAction class and the service loader configuration
    from(sourceSets.main.output) {
        include 'org/example/plugin/FileAction.class'
        include 'org/example/plugin/ActionLogger.class'
        include 'org/example/plugin/impl/UnzipFileAction.class'
        include 'org/example/plugin/impl/UnzipFileAction$*.class' // Inner classes if any
        include 'META-INF/services/org.example.plugin.FileAction'
    }

    // Set the destination directory
    destinationDirectory = file("${projectDir}/plugins")

    manifest {
        attributes(
            'Implementation-Title': 'Unzip Plugin',
            'Implementation-Version': archiveVersion,
            'Built-By': System.getProperty('user.name'),
            'Built-Date': new Date(),
            'Built-JDK': System.getProperty('java.version')
        )
    }
}

// Make the plugin jar depend on compilation
unzipPluginJar.dependsOn classes