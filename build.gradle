plugins {
    id 'java'
    id 'groovy'
    id 'maven-publish'
    id 'application'
    id 'jacoco'
    id 'pmd'
    id 'com.github.spotbugs' version '6.0.7'
    id 'org.sonarqube' version '5.1.0.4882'
}

group = 'com.selectrix'
version = '1.0.1-SNAPSHOT'

// Application plugin configuration
application {
    mainClass = 'com.selectrix.Main'
    applicationName = 'Selectrix'
}

repositories {
    mavenLocal()
//    maven {
//        url 'https://pkgs.dev.azure.com/interamerican/_packaging/interamerican/maven/v1'
//        name 'interamerican'
//        credentials {
//            username = project.findProperty('systemProp.https.proxyUser') ?: System.getenv('AZURE_DEVOPS_USER')
//            password = project.findProperty('systemProp.https.proxyPassword') ?: System.getenv('AZURE_DEVOPS_PASSWORD')
//        }
//        authentication {
//            basic(BasicAuthentication)
//        }
//    }
    mavenCentral()
}

// Custom configuration for external plugins
configurations {
    externalPlugins {
        canBeResolved = true
        canBeConsumed = false
        transitive = false  // Don't include transitive dependencies
    }
}

dependencies {
    testImplementation platform('org.spockframework:spock-bom:2.3-groovy-3.0')
    testImplementation 'org.spockframework:spock-core'
    testImplementation 'org.codehaus.groovy:groovy-all:3.0.21'

    // External plugins (fetched from Maven Local)
    externalPlugins 'com.selectrix.plugins:unzip-plugin:1.0'
    externalPlugins 'com.selectrix.plugins:flatten-plugin:1.0'
    externalPlugins 'com.selectrix.plugins:pdf-concatenate-plugin:1.0'
    externalPlugins 'com.selectrix.plugins:kebab-case-rename-plugin:1.1'
}

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport // Generate report after tests run
}

// JaCoCo Configuration
jacoco {
    toolVersion = "0.8.11"
}

jacocoTestReport {
    dependsOn test // Tests are required to run before generating the report

    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
}

// Custom task to run tests and show coverage report location
tasks.register('testWithCoverage') {
    dependsOn test, jacocoTestReport
    description = 'Runs tests and generates code coverage report'
    group = 'verification'

    doLast {
        println ""
        println "=========================================="
        println "Code Coverage Report Generated!"
        println "=========================================="
        println "HTML Report: ${project.buildDir}/reports/jacoco/test/html/index.html"
        println "XML Report:  ${project.buildDir}/reports/jacoco/test/jacocoTestReport.xml"
        println "=========================================="
    }
}

// PMD Configuration
pmd {
    toolVersion = '7.0.0'
    consoleOutput = true
    ignoreFailures = true
    ruleSets = [] // Clear default rulesets
    ruleSetFiles = files("${rootDir}/config/pmd/ruleset.xml")
}

pmdMain {
    reports {
        xml.required = true
        html.required = true
    }
}

pmdTest {
    reports {
        xml.required = true
        html.required = true
    }
}

// Custom task to run PMD and show report location
tasks.register('pmdCheck') {
    dependsOn pmdMain, pmdTest
    description = 'Runs PMD static code analysis'
    group = 'verification'

    doLast {
        println ""
        println "=========================================="
        println "PMD Analysis Complete!"
        println "=========================================="
        println "Main HTML Report: ${project.buildDir}/reports/pmd/main.html"
        println "Main XML Report:  ${project.buildDir}/reports/pmd/main.xml"
        println "Test HTML Report: ${project.buildDir}/reports/pmd/test.html"
        println "Test XML Report:  ${project.buildDir}/reports/pmd/test.xml"
        println "=========================================="
    }
}

// SpotBugs Configuration
spotbugs {
    effort = 'max'
    reportLevel = 'medium'
    ignoreFailures = true
}

spotbugsMain {
    reports {
        html {
            required = true
            outputLocation = file("$buildDir/reports/spotbugs/main.html")
            stylesheet = 'fancy-hist.xsl'
        }
        xml {
            required = true
            outputLocation = file("$buildDir/reports/spotbugs/main.xml")
        }
    }
}

spotbugsTest {
    reports {
        html {
            required = true
            outputLocation = file("$buildDir/reports/spotbugs/test.html")
            stylesheet = 'fancy-hist.xsl'
        }
        xml {
            required = true
            outputLocation = file("$buildDir/reports/spotbugs/test.xml")
        }
    }
}

// Custom task to run SpotBugs and show report location
tasks.register('spotbugsCheck') {
    dependsOn spotbugsMain, spotbugsTest
    description = 'Runs SpotBugs static bug detection'
    group = 'verification'

    doLast {
        println ""
        println "=========================================="
        println "SpotBugs Analysis Complete!"
        println "=========================================="
        println "Main HTML Report: ${project.buildDir}/reports/spotbugs/main.html"
        println "Main XML Report:  ${project.buildDir}/reports/spotbugs/main.xml"
        println "Test HTML Report: ${project.buildDir}/reports/spotbugs/test.html"
        println "Test XML Report:  ${project.buildDir}/reports/spotbugs/test.xml"
        println "=========================================="
    }
}

// SonarQube Configuration
sonar {
    properties {
        property 'sonar.projectKey', 'selectrix'
        property 'sonar.projectName', 'Selectrix'
        property 'sonar.projectVersion', version
        property 'sonar.sourceEncoding', 'UTF-8'

        // Source directories
        property 'sonar.sources', 'src/main/java'
        property 'sonar.tests', 'src/test/groovy'

        // Coverage reports
        property 'sonar.coverage.jacoco.xmlReportPaths', "${buildDir}/reports/jacoco/test/jacocoTestReport.xml"

        // PMD reports
        property 'sonar.java.pmd.reportPaths', "${buildDir}/reports/pmd/main.xml"

        // SpotBugs reports
        property 'sonar.java.spotbugs.reportPaths', "${buildDir}/reports/spotbugs/main.xml"

        // Exclusions (optional - customize as needed)
        property 'sonar.exclusions', '**/Main.java'  // Exclude GUI main class from analysis

        // Java version
        property 'sonar.java.source', '17'
        property 'sonar.java.target', '17'
    }
}

// Make sonarqube task depend on all quality checks
tasks.named('sonar') {
    dependsOn test, jacocoTestReport, pmdMain, spotbugsMain
}

// Task to run all quality checks
tasks.register('qualityCheck') {
    dependsOn test, jacocoTestReport, pmdMain, pmdTest, spotbugsMain, spotbugsTest
    description = 'Runs all quality checks (tests, coverage, PMD, SpotBugs)'
    group = 'verification'

    doLast {
        println ""
        println "=========================================="
        println "All Quality Checks Complete!"
        println "=========================================="
        println "Coverage Report:  ${project.buildDir}/reports/jacoco/test/html/index.html"
        println "PMD Report:       ${project.buildDir}/reports/pmd/main.html"
        println "SpotBugs Report:  ${project.buildDir}/reports/spotbugs/main.html"
        println "=========================================="
        println ""
        println "To upload to SonarQube, run:"
        println "  ./gradlew sonar -Dsonar.host.url=<your-sonarqube-url> -Dsonar.token=<your-token>"
        println "=========================================="
    }
}

// Task to build the plugin API JAR (only interfaces needed for plugin development)
task pluginApiJar(type: Jar) {
    archiveBaseName = 'selectrix-plugin-api'
    archiveVersion = '1.0'

    // Include only the plugin API interfaces
    from(sourceSets.main.output) {
        include 'com/selectrix/plugin/FileAction.class'
        include 'com/selectrix/plugin/ActionLogger.class'
        include 'com/selectrix/plugin/ProcessingContext.class'
    }

    // Also include source files for plugin developers
    from(sourceSets.main.java) {
        include 'com/selectrix/plugin/FileAction.java'
        include 'com/selectrix/plugin/ActionLogger.java'
        include 'com/selectrix/plugin/ProcessingContext.java'
        into 'sources'
    }

    // Set the destination directory
    destinationDirectory = file("${projectDir}/api")

    manifest {
        attributes(
            'Implementation-Title': 'Selectrix Plugin API',
            'Implementation-Version': archiveVersion,
            'Built-By': System.getProperty('user.name'),
            'Built-Date': new Date(),
            'Built-JDK': System.getProperty('java.version'),
            'Specification-Title': 'Selectrix Plugin API',
            'Specification-Version': archiveVersion
        )
    }
}

// Make the plugin API jar depend on compilation
pluginApiJar.dependsOn classes

// Task to copy external plugins from Maven Local to plugins directory
task copyExternalPlugins(type: Copy) {
    description = 'Copies external plugin JARs from Maven Local to plugins directory'
    group = 'plugin'

    from configurations.externalPlugins
    into "${projectDir}/plugins"

    doFirst {
        // Clean the plugins directory first
        delete fileTree("${projectDir}/plugins") {
            include '*.jar'
        }
        println "Resolving external plugins from Maven Local..."
    }

    doLast {
        println "External plugins copied to plugins/:"
        fileTree("${projectDir}/plugins").files.each { file ->
            println "  - ${file.name}"
        }
    }
}

// Make build depend on copying plugins
processResources.dependsOn copyExternalPlugins

// Configure Maven Publishing for the Plugin API
publishing {
    publications {
        pluginApi(MavenPublication) {
            groupId = 'com.selectrix'
            artifactId = 'plugin-api'
            version = '1.0'

            // Publish the plugin API JAR
            artifact(pluginApiJar) {
                classifier = ''
            }

            pom {
                name = 'Selectrix Plugin API'
                description = 'Plugin API for Selectrix application'

                developers {
                    developer {
                        id = 'selectrix'
                        name = 'Selectrix Team'
                    }
                }
            }
        }
    }

    repositories {
        mavenLocal()
    }
}

// Make publishing depend on the API JAR being built
tasks.named('publishPluginApiPublicationToMavenLocal') {
    dependsOn pluginApiJar
}

// Distribution configuration
distributions {
    main {
        contents {
            // Include the external plugins directory
            from('plugins') {
                into 'plugins'
            }
            // Include README if it exists
            from('.') {
                include 'README.md'
            }
        }
    }
}

// Ensure plugins are copied before creating distribution
tasks.named('distZip') {
    dependsOn tasks.named('copyExternalPlugins')
}

tasks.named('distTar') {
    dependsOn tasks.named('copyExternalPlugins')
}
