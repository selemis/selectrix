# File Selector UI Configuration
# This file contains customizable UI settings for the File Selector application

# Window settings
window.width=1000
window.height=600
window.title=File Selector

# Colors (RGB format: red,green,blue where each value is 0-255)
# Highlight color for selected rows in the file table
highlight.color=173,216,230

# Console area colors
console.background.color=240,240,240
console.text.color=60,60,60
console.border.color=200,200,200

# Font settings
# Available fonts: Monospaced, SansSerif, Serif, Dialog, DialogInput

# Console font (for log output area)
console.font.name=Monospaced
console.font.size=12

# UI font (for menus, buttons, table, and other UI elements)
ui.font.name=SansSerif
ui.font.size=12

# Table settings
# Row height in pixels
table.row.height=25

# Split pane settings
# Ratio between table and console (0.0-1.0, where 0.7 means 70% for table, 30% for console)
split.pane.ratio=0.7
